<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARK-iR | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #5b6ee0;
            --blue-dark: #4c5fd6;
            --ink: #101114;
            --gray-btn: #dcdcdc;
            --gray-btn-border: #161616;
            --gray-line: #c9c9c9;
            --ok: #5f8f82;
            --danger: #e3453b;
            --side-w: 186px;
            --top-h: 121px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: var(--ink);
        }

        .dash {
            display: grid;
            grid-template-columns: var(--side-w) 1fr;
            grid-template-rows: var(--top-h) 1fr;
            height: 100vh;
            width: 100vw;
            transition: grid-template-columns .25s ease;
        }

        .topbar {
            grid-column: 1 / 3;
            grid-row: 1;
            display: grid;
            grid-template-columns: var(--side-w) 1fr;
            background: var(--blue);
            background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px);
            background-size: 3px 3px;
            border-bottom: 3px solid #111214;
            transition: grid-template-columns .25s ease;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #111214;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
        }

        .icon-btn svg {
            width: 56px;
            height: 56px;
            color: #111214;
        }

        .icon-btn .icon-hamburger {
            display: none;
        }

        .dash.collapsed .icon-btn .icon-profile {
            display: none;
        }

        .dash.collapsed .icon-btn .icon-hamburger {
            display: block;
        }

        .topbar-right {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
        }

        .brand-block {
            text-align: center;
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 44px;
            letter-spacing: .5px;
            color: #fff;
            text-shadow: 0 2px 0 rgba(0, 0, 0, .12);
            line-height: 1;
        }

        .brand-sub {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            margin-top: 4px;
        }

        .topbar-logo {
            position: absolute;
            right: 26px;
            top: 50%;
            transform: translateY(-50%);
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #111214;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 0 2px #2c2d30;
        }

        .topbar-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-fallback .P {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 30px;
            color: #2fb6b0;
            line-height: 1;
            margin-top: 2px;
        }

        .logo-fallback .tag {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-style: italic;
            font-size: 7px;
            letter-spacing: .5px;
            color: #fff;
            background: #151517;
            padding: 1px 4px;
            border-radius: 2px;
            margin-top: 1px;
        }

        .sidebar {
            grid-column: 1;
            grid-row: 2;
            background: var(--blue);
            background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px);
            background-size: 3px 3px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px 24px;
            overflow: hidden;
            transition: opacity .2s ease;
        }

        .dash.collapsed .sidebar {
            display: none;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-btn {
            width: 100%;
            background: var(--gray-btn);
            border: 1.5px solid var(--gray-btn-border);
            border-radius: 6px;
            padding: 14px 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: .3px;
            color: var(--ink);
            text-align: center;
            cursor: pointer;
            transition: background .15s ease;
        }

        .nav-btn:hover {
            background: #cfcfcf;
        }

        .logout-btn {
            margin-top: 20px;
        }

        .content {
            grid-column: 2;
            grid-row: 2;
            background: #fff;
            padding: 26px 36px 30px;
            overflow: auto;
            transition: grid-column .1s ease;
        }

        .dash.collapsed .content {
            grid-column: 1 / 3;
        }

        .welcome {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 34px;
        }

        .stats-area {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .stats-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 46px;
            flex: 1 1 420px;
            max-width: 560px;
        }

        .stat-block {
            padding-bottom: 18px;
        }

        .stat-label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .3px;
            margin-bottom: 14px;
        }

        .stat-pair {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .stat-sub {
            font-size: 13px;
            font-weight: 500;
            color: #3a3a3c;
        }

        .stat-num {
            font-size: 30px;
            font-weight: 600;
        }

        .stat-sep {
            font-size: 26px;
            color: hsl(0, 0%, 0%);
            font-weight: 300;
        }

        .stat-num-big {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .stat-caption {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .5px;
            color: #6b6b6f;
            margin-top: 2px;
        }

        .stat-time {
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1c1c1e;
        }

        .stat-line {
            grid-column: 1/3;
            border: none;
            border-top: 1px solid var(--gray-line);
            margin: 0;
        }

        .table-card {
            flex: 1 1 420px;
            max-width: 490px;
            border: 1.5px solid #b9b9bb;
            border-radius: 14px;
            padding: 18px 22px 20px;
        }

        .table-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .3px;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .3px;
            color: #1c1c1e;
            border-bottom: 1.5px solid #1c1c1e;
            padding: 0 6px 10px;
        }

        thead th:nth-child(1) {
            width: 34px;
        }

        thead th:nth-child(3) {
            text-align: center;
        }

        thead th:nth-child(4) {
            text-align: right;
        }

        tbody td {
            font-size: 12.5px;
            font-weight: 500;
            padding: 12px 6px;
            border-bottom: 1px solid #d9d9db;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody td:nth-child(3) {
            text-align: center;
        }

        tbody td:nth-child(4) {
            text-align: right;
            color: #3a3a3c;
        }

        .pill {
            display: inline-block;
            width: 100px;
            height: 16px;
            border-radius: 8px;
        }

        .pill-ok {
            background: var(--ok);
        }

        .pill-danger {
            background: var(--danger);
        }

        @media (max-width:900px) {
            .brand-title {
                font-size: 30px;
            }

            .brand-sub {
                font-size: 11px;
            }

            .stats-cols {
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <div class="dash" id="dash">

        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-btn" id="navToggle" aria-label="Tampilkan / sembunyikan navbar">
                    <svg class="icon-profile" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                    </svg>
                    <svg class="icon-hamburger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                        stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="topbar-right">
                <div class="brand-block">
                    <div class="brand-title">PARK-iR</div>
                    <div class="brand-sub">SISTEM PARKIR BERBASIS DIGITAL</div>
                </div>
                <div class="topbar-logo">
                    <img src="LOGO PARK-iR.png" alt="Logo PARK-iR"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback">
                        <span class="P">P</span>
                        <span class="tag">PARK-IR</span>
                    </div>
                </div>
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <nav class="nav-list">
                <form action="dashboard.html">
                    <button class="nav-btn">DASHBOARD</button>
                </form>
                <button class="nav-btn">KEND MASUK</button>
                <button class="nav-btn">KEND KELUAR</button>
                <button class="nav-btn">RIWAYAT</button>
            </nav>
            <button class="nav-btn logout-btn">LOGOUT</button>
        </aside>

        <main class="content">
            <h1 class="welcome">SELAMAT DATANG ADMIN!</h1>

            <div class="stats-area">
                <div class="stats-cols">

                    <div class="stat-block">
                        <div class="stat-label">KENDARAAN PARKIR</div>
                        <div class="stat-pair">
                            <div class="stat-item"><span class="stat-sub">Masuk</span><span class="stat-num"
                                    id="statMasuk"></span></div>
                            <span class="stat-sep">|</span>
                            <div class="stat-item"><span class="stat-sub">Keluar</span><span class="stat-num"
                                    id="statKeluar"></span></div>
                        </div>
                    </div>

                    <div class="stat-block">
                        <div class="stat-label">PENDAPATAN HARIAN</div>
                        <div class="stat-num-big" id="statPendapatan"></div>
                    </div>

                    <hr class="stat-line">

                    <div class="stat-block">
                        <div class="stat-label">TRANSAKSI TERBARU</div>
                    </div>

                    <div class="stat-block">
                        <div class="stat-label">WAKTU TERBARU</div>
                        <div class="stat-time">Masuk Terakhir&nbsp;|&nbsp;<span id="waktuMasukTerakhir"></span></div>
                        <div class="stat-time">Keluar terakhir&nbsp;|&nbsp;<span id="waktuKeluarTerakhir"></span></div>
                    </div>

                </div>

                <div class="table-card">
                    <div class="table-title">TRANSAKSI TERBARU</div>
                    <table>
                        <thead>
                            <tr>
                                <th>NO.</th>
                                <th>NO PLAT</th>
                                <th>STATUS</th>
                                <th>WAKTU</th>
                            </tr>
                        </thead>
                        <tbody id="transaksiBody">
                        </tbody>
                    </table>
                </div>

            </div>
        </main>

    </div>

    <script>
        const dash = document.getElementById('dash');
        const navToggle = document.getElementById('navToggle');

        navToggle.addEventListener('click', () => {
            dash.classList.toggle('collapsed');
            dash.style.setProperty('--side-w', dash.classList.contains('collapsed') ? '70px' : '186px');
        });
    </script>

</body>

</html>
