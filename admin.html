<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARK-iR | Management User</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5b6ee0;
    --blue-dark:#4c5fd6;
    --ink:#101114;
    --gray-btn:#dcdcdc;
    --gray-btn-border:#161616;
    --gray-line:#c9c9c9;
    --ok:#5f8f82;
    --danger:#e3453b;
    --side-w:186px;
    --top-h:121px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;font-family:'Poppins',sans-serif;color:var(--ink);}

  .dash{
    display:grid;
    grid-template-columns:var(--side-w) 1fr;
    grid-template-rows:var(--top-h) 1fr;
    height:100vh;
    width:100vw;
    transition:grid-template-columns .25s ease;
  }

  .topbar{
    grid-column:1 / 3;
    grid-row:1;
    display:grid;
    grid-template-columns:var(--side-w) 1fr;
    background:var(--blue);
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px;
    border-bottom:3px solid #111214;
    transition:grid-template-columns .25s ease;
  }

  .topbar-left{
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:2px solid #111214;
  }

  .icon-btn{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
  }

  .icon-btn svg{
    width:56px;
    height:56px;
    color:#111214;
  }

  .icon-btn .icon-hamburger{display:none;}
  .dash.collapsed .icon-btn .icon-profile{display:none;}
  .dash.collapsed .icon-btn .icon-hamburger{display:block;}

  .topbar-right{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 30px;
  }

  .brand-block{text-align:center;}

  .brand-title{
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    font-style:italic;
    font-size:44px;
    letter-spacing:.5px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
    line-height:1;
  }

  .brand-sub{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    color:#fff;
    margin-top:4px;
  }

  .topbar-logo{
    position:absolute;
    right:26px;
    top:50%;
    transform:translateY(-50%);
    width:74px;
    height:74px;
    border-radius:50%;
    background:#111214;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:inset 0 0 0 2px #2c2d30;
  }

  .topbar-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }

  .logo-fallback{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .logo-fallback .P{
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    font-style:italic;
    font-size:30px;
    color:#2fb6b0;
    line-height:1;
    margin-top:2px;
  }

  .logo-fallback .tag{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-style:italic;
    font-size:7px;
    letter-spacing:.5px;
    color:#fff;
    background:#151517;
    padding:1px 4px;
    border-radius:2px;
    margin-top:1px;
  }

  .sidebar{
    grid-column:1;
    grid-row:2;
    background:var(--blue);
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:20px 16px 24px;
    border-right:2px solid #111214;
    overflow:hidden;
    transition:opacity .2s ease;
  }

  .dash.collapsed .sidebar{
    display:none;
  }

  .nav-list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .nav-btn{
    width:100%;
    background:var(--gray-btn);
    border:1.5px solid var(--gray-btn-border);
    border-radius:6px;
    padding:14px 10px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.3px;
    color:var(--ink);
    text-align:center;
    cursor:pointer;
    transition:background .15s ease;
  }

  .nav-btn:hover{
    background:#cfcfcf;
  }

  .logout-btn{
    margin-top:20px;
  }

  .content{
    grid-column:2;
    grid-row:2;
    background:#fff;
    padding:26px 36px 30px;
    overflow:auto;
    transition:grid-column .1s ease;
  }

  .dash.collapsed .content{
    grid-column:1 / 3;
  }

  .page-title{
    font-size:23px;
    font-weight:700;
    letter-spacing:.3px;
    color:#232a7c;
    margin:0 0 26px;
  }

  .mu-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
  }

  .page-title{margin:0;}

  .btn-tambah{
    display:flex;
    align-items:center;
    gap:8px;
    height:40px;
    padding:0 20px;
    background:#2b2fa0;
    color:#fff;
    border:none;
    border-radius:20px;
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
  }

  .btn-tambah svg{width:15px;height:15px;}

  .mu-cards{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }

  .mu-card{
    flex:1 1 220px;
    max-width:270px;
    display:flex;
    align-items:center;
    gap:14px;
    border:1.5px solid #16181c;
    border-radius:10px;
    padding:14px 18px;
  }

  .mu-card-icon{
    flex:0 0 auto;
    width:46px;
    height:46px;
    border-radius:8px;
    border:1.5px solid #16181c;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .mu-card-icon svg{width:26px;height:26px;}

  .mu-icon-total{color:#101114;}
  .mu-icon-aktif{color:#3fae63;}
  .mu-icon-nonaktif{color:#e14b41;}

  .mu-card-label{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.3px;
    color:#3a3a3c;
  }

  .mu-card-num{
    font-size:22px;
    font-weight:700;
    min-height:27px;
    line-height:1.2;
  }

  .mu-card-caption{
    font-size:11px;
    color:#6b6b6f;
  }

  .mu-toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }

  .mu-search{
    flex:1 1 320px;
    display:flex;
    align-items:center;
    gap:10px;
    border:1.5px solid #b9b9bb;
    border-radius:8px;
    padding:10px 16px;
  }

  .mu-search svg{width:17px;height:17px;color:#7a7a7c;flex:0 0 auto;}

  .mu-search input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    color:#101114;
  }

  .mu-search input::placeholder{color:#9a9a9c;}

  .mu-status-box{
    flex:0 1 220px;
    border:1.5px solid #b9b9bb;
    border-radius:8px;
    padding:10px 16px;
    font-size:13.5px;
    color:#101114;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .mu-status-box.active{
    border-color:#2b2fa0;
    color:#2b2fa0;
    font-weight:600;
  }

  .filter-dropdown{position:relative;flex:0 0 auto;}

  .btn-filter{
    display:flex;
    align-items:center;
    gap:9px;
    height:42px;
    padding:0 18px;
    background:#fff;
    border:1.5px solid #2b2fa0;
    color:#2b2fa0;
    border-radius:8px;
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }

  .btn-filter svg{width:16px;height:16px;}

  .filter-menu{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    min-width:170px;
    background:#fff;
    border:1.5px solid #16181c;
    border-radius:8px;
    box-shadow:0 10px 24px rgba(0,0,0,.14);
    padding:6px;
    margin:0;
    list-style:none;
    z-index:20;
  }

  .filter-dropdown.open .filter-menu{display:block;}

  .filter-menu li{
    padding:9px 12px;
    font-size:13.5px;
    font-weight:500;
    border-radius:5px;
    cursor:pointer;
  }

  .filter-menu li:hover{background:#eef0fb;}

  .mu-table-wrap{
    border:1.5px solid #16181c;
    border-radius:12px;
    padding:8px 24px 6px;
    overflow-x:auto;
  }

  .mu-table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
  }

  .mu-table thead th{
    text-align:left;
    font-size:13px;
    font-weight:600;
    color:#101114;
    padding:14px 10px;
    border-bottom:1.5px solid #16181c;
  }

  .mu-table thead th.col-no{width:50px;}
  .mu-table thead th.col-aksi{width:110px;text-align:center;}

  .mu-table tbody td{
    font-size:13px;
    padding:16px 10px;
    border-bottom:1px solid #d9d9db;
    color:#101114;
  }

  .mu-table tbody tr:last-child td{border-bottom:none;}

  .mu-table tbody td.col-aksi{text-align:center;}

  .badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:16px;
    font-size:12.5px;
    font-weight:600;
    color:#fff;
  }

  .badge-role-admin{background:#5b6ee0;}
  .badge-role-petugas{background:#3fae63;}
  .badge-status-aktif{background:#7fe08a;color:#1c4a26;}
  .badge-status-nonaktif{background:#f3a29c;color:#7a1f18;}

  .icon-action{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:7px;
    border:1.5px solid #16181c;
    background:#fff;
    cursor:pointer;
    margin:0 3px;
  }

  .icon-action svg{width:15px;height:15px;}

  .icon-edit{color:#2b2fa0;border-color:#2b2fa0;}
  .icon-delete{color:#fff;background:#e3453b;border-color:#e3453b;}

  @media (max-width:900px){
    .brand-title{font-size:30px;}
    .brand-sub{font-size:11px;}
    .stats-cols{max-width:none;}
  }
</style>
</head>
<body>

<div class="dash" id="dash">

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="navToggle" aria-label="Tampilkan / sembunyikan navbar">
        <svg class="icon-profile" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
        <svg class="icon-hamburger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
    <div class="topbar-right">
      <div class="brand-block">
        <div class="brand-title">PARK-iR</div>
        <div class="brand-sub">SISTEM PARKIR BERBASIS DIGITAL</div>
      </div>
      <div class="topbar-logo">
        <img src="LOGO PARK-iR.png" alt="Logo PARK-iR"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback">
          <span class="P">P</span>
          <span class="tag">PARK-IR</span>
        </div>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav class="nav-list">
        <form action="dashboard.html">
      <button class="nav-btn">DASHBOARD</button>
        </form>
        <form action="kndmasuk.html">
      <button class="nav-btn">KEND MASUK</button>
        </form>
        <form action="kndkluar.html">
      <button class="nav-btn">KEND KELUAR</button>
        </form>
        <form action="riwayat.html">
      <button class="nav-btn">RIWAYAT</button>
        </form>
    </nav>
    <button class="nav-btn logout-btn">LOGOUT</button>
  </aside>

  <main class="content">
    <div class="mu-topbar">
      <h1 class="page-title">FORM ADMIN</h1>
      <button type="button" class="btn-tambah">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        TAMBAH USER
      </button>
    </div>

    <div class="mu-cards">
      <div class="mu-card">
        <div class="mu-card-icon mu-icon-total">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
        </div>
        <div class="mu-card-body">
          <div class="mu-card-label">TOTAL USER</div>
          <div class="mu-card-num" id="totalUser"></div>
          <div class="mu-card-caption">USER</div>
        </div>
      </div>

      <div class="mu-card">
        <div class="mu-card-icon mu-icon-aktif">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="8" r="3.6"></circle><path d="M3.5 19c0-3.6 3-6.4 6.5-6.4S16.5 15.4 16.5 19"></path><path d="M15 12.5l2 2 3.6-4"></path></svg>
        </div>
        <div class="mu-card-body">
          <div class="mu-card-label">USER AKTIF</div>
          <div class="mu-card-num" id="userAktif"></div>
          <div class="mu-card-caption">USER</div>
        </div>
      </div>

      <div class="mu-card">
        <div class="mu-card-icon mu-icon-nonaktif">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="8" r="3.6"></circle><path d="M3.5 19c0-3.6 3-6.4 6.5-6.4S16.5 15.4 16.5 19"></path><line x1="15.2" y1="10.8" x2="20.4" y2="16"></line><line x1="20.4" y1="10.8" x2="15.2" y2="16"></line></svg>
        </div>
        <div class="mu-card-body">
          <div class="mu-card-label">USER NONAKTIF</div>
          <div class="mu-card-num" id="userNonaktif"></div>
          <div class="mu-card-caption">USER</div>
        </div>
      </div>
    </div>

    <div class="mu-toolbar">
      <div class="mu-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
        <input type="text" id="searchUser" placeholder="Cari nama, username...">
      </div>

      <div class="mu-status-box" id="statusBox">
        <span id="statusBoxText">SEMUA STATUS</span>
      </div>

      <div class="filter-dropdown" id="filterDropdown">
        <button type="button" class="btn-filter" id="filterTrigger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 4 21 4 14 13 14 19 10 21 10 13 3 4"></polygon></svg>
          FILTER
        </button>
        <ul class="filter-menu" id="filterMenu"></ul>
      </div>
    </div>

    <div class="mu-table-wrap">
      <table class="mu-table">
        <thead>
          <tr>
            <th class="col-no">NO.</th>
            <th>NAMA</th>
            <th>ID</th>
            <th>ROLE</th>
            <th>STATUS</th>
            <th>TERAKHIR LOGIN</th>
            <th class="col-aksi">AKSI</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
      </table>
    </div>
  </main>

</div>

<script>
  const filterDropdown = document.getElementById('filterDropdown');
  const filterTrigger  = document.getElementById('filterTrigger');
  const filterMenu     = document.getElementById('filterMenu');
  const statusBox      = document.getElementById('statusBox');
  const statusBoxText  = document.getElementById('statusBoxText');

  const filterOptions = {
    top: ['Aa-Zz', 'Role', 'Status'],
    Role: ['Administrator', 'Petugas'],
    Status: ['Aktif', 'Nonaktif']
  };

  let filterLevel = 'top'; 

  function renderFilterMenu(){
    filterMenu.innerHTML = '';
    filterOptions[filterLevel].forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      li.addEventListener('click', (e) => {
        e.stopPropagation();

        if (filterLevel === 'top' && (item === 'Role' || item === 'Status')) {
          filterLevel = item;
          renderFilterMenu();
          return;
        }

        if (filterLevel === 'top' && item === 'Aa-Zz') {
          statusBoxText.textContent = 'Urutan A-Z';
        } else if (filterLevel === 'Role') {
          statusBoxText.textContent = 'Role: ' + item;
        } else if (filterLevel === 'Status') {
          statusBoxText.textContent = 'Status: ' + item;
        }

        statusBox.classList.add('active');
        closeFilterMenu();
      });
      filterMenu.appendChild(li);
    });
  }

  function openFilterMenu(){
    filterLevel = 'top';
    renderFilterMenu();
    filterDropdown.classList.add('open');
  }

  function closeFilterMenu(){
    filterDropdown.classList.remove('open');
  }

  filterTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    filterDropdown.classList.contains('open') ? closeFilterMenu() : openFilterMenu();
  });

  document.addEventListener('click', closeFilterMenu);

  statusBox.addEventListener('click', () => {
    statusBoxText.textContent = 'semua status';
    statusBox.classList.remove('active');
  });
</script>

<script>
  const dash = document.getElementById('dash');
  const navToggle = document.getElementById('navToggle');

  navToggle.addEventListener('click', () => {
    dash.classList.toggle('collapsed');
    dash.style.setProperty('--side-w', dash.classList.contains('collapsed') ? '70px' : '186px');
  });
</script>

</body>
</html>
