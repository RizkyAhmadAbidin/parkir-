<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARK-iR | Kendaraan Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5b6ee0;
    --blue-dark:#4c5fd6;
    --ink:#101114;
    --gray-btn:#dcdcdc;
    --gray-btn-border:#161616;
    --gray-line:#c9c9c9;
    --ok:#5f8f82;
    --danger:#e3453b;
    --side-w:186px;
    --top-h:121px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;font-family:'Poppins',sans-serif;color:var(--ink);}

  .dash{
    display:grid;
    grid-template-columns:var(--side-w) 1fr;
    grid-template-rows:var(--top-h) 1fr;
    height:100vh;
    width:100vw;
    transition:grid-template-columns .25s ease;
  }

  .topbar{
    grid-column:1 / 3;
    grid-row:1;
    display:grid;
    grid-template-columns:var(--side-w) 1fr;
    background:var(--blue);
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px;
    border-bottom:3px solid #111214;
    transition:grid-template-columns .25s ease;
  }

  .topbar-left{
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:2px solid #111214;
  }

  .icon-btn{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
  }

  .icon-btn svg{
    width:56px;
    height:56px;
    color:#111214;
  }

  .icon-btn .icon-hamburger{display:none;}
  .dash.collapsed .icon-btn .icon-profile{display:none;}
  .dash.collapsed .icon-btn .icon-hamburger{display:block;}

  .topbar-right{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 30px;
  }

  .brand-block{text-align:center;}

  .brand-title{
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    font-style:italic;
    font-size:44px;
    letter-spacing:.5px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
    line-height:1;
  }

  .brand-sub{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    color:#fff;
    margin-top:4px;
  }

  .topbar-logo{
    position:absolute;
    right:26px;
    top:50%;
    transform:translateY(-50%);
    width:74px;
    height:74px;
    border-radius:50%;
    background:#111214;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:inset 0 0 0 2px #2c2d30;
  }

  .topbar-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }

  .logo-fallback{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .logo-fallback .P{
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    font-style:italic;
    font-size:30px;
    color:#2fb6b0;
    line-height:1;
    margin-top:2px;
  }

  .logo-fallback .tag{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-style:italic;
    font-size:7px;
    letter-spacing:.5px;
    color:#fff;
    background:#151517;
    padding:1px 4px;
    border-radius:2px;
    margin-top:1px;
  }

  .sidebar{
    grid-column:1;
    grid-row:2;
    background:var(--blue);
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:20px 16px 24px;
    border-right:2px solid #111214;
    overflow:hidden;
    transition:opacity .2s ease;
  }

  .dash.collapsed .sidebar{
    display:none;
  }

  .nav-list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .nav-btn{
    width:100%;
    background:var(--gray-btn);
    border:1.5px solid var(--gray-btn-border);
    border-radius:6px;
    padding:14px 10px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.3px;
    color:var(--ink);
    text-align:center;
    cursor:pointer;
    transition:background .15s ease;
  }

  .nav-btn:hover{
    background:#cfcfcf;
  }

  .logout-btn{
    margin-top:20px;
  }

  .content{
    grid-column:2;
    grid-row:2;
    background:#fff;
    padding:26px 36px 30px;
    overflow:auto;
    transition:grid-column .1s ease;
  }

  .dash.collapsed .content{
    grid-column:1 / 3;
  }

  .page-title{
    font-size:23px;
    font-weight:700;
    letter-spacing:.3px;
    color:#232a7c;
    margin:0 0 26px;
  }

  .masuk-grid{
    display:flex;
    gap:22px;
    align-items:stretch;
    flex-wrap:wrap;
  }

  .panel{
    border:1.5px solid #16181c;
    border-radius:10px;
    padding:22px 26px 26px;
  }

  .panel-left{
    flex:1 1 460px;
    max-width:520px;
  }

  .panel-right{
    flex:1 1 420px;
    max-width:500px;
  }

  .panel-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }

  .panel-icon{
    width:22px;
    height:22px;
    color:#3446c4;
    flex:0 0 auto;
  }

  .panel-head-text{
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    color:#3446c4;
  }

  .panel-desc{
    font-size:13px;
    color:#3a3a3c;
    margin:0 0 20px;
  }

  .field-label{
    display:block;
    font-size:14px;
    font-weight:700;
    color:#101114;
    margin-bottom:10px;
  }

  .plate-row{
    display:flex;
    align-items:center;
    gap:18px;
    border:1.5px solid #c3c3c5;
    border-radius:8px;
    padding:10px 20px;
    margin-bottom:26px;
  }

  .plate-icon-box{
    position:relative;
    width:96px;
    height:52px;
    flex:0 0 auto;
    border:2px dashed #3446c4;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .plate-icon-box img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .plate-icon-fallback{
    display:none;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-style:italic;
    font-size:15px;
    letter-spacing:1px;
    color:#101114;
  }

  .plate-text{
    display:flex;
    align-items:center;
    gap:22px;
    min-height:30px;
    flex:1;
  }

  .plate-input{
    border:none;
    border-bottom:2px solid transparent;
    background:transparent;
    outline:none;
    font-family:'Poppins',sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:.5px;
    color:#101114;
    text-transform:uppercase;
    padding:2px 0;
    transition:border-color .15s ease;
  }

  .plate-input::placeholder{
    color:#c4c4c6;
    font-weight:700;
  }

  .plate-input:focus{
    border-bottom-color:#3446c4;
  }

  .plate-input-w{width:56px;}
  .plate-input-n{width:92px;}

  .jenis-row{
    display:flex;
    gap:20px;
  }

  .jenis-card{
    flex:1 1 0;
    background:#fff;
    border:1.5px solid #16181c;
    border-radius:8px;
    padding:16px;
    min-height:110px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    cursor:pointer;
    text-align:left;
  }

  .jenis-card.active{
    border-width:2.5px;
  }

  .jenis-tag{
    display:inline-block;
    padding:6px 16px;
    border-radius:6px;
    border:1.5px solid #16181c;
    font-size:14px;
    font-weight:700;
    color:#101114;
  }

  .jenis-tag-mobil{background:#7fa89a;}
  .jenis-tag-motor{background:#e14b41;color:#fff;}

  .jenis-icon{
    width:64px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    align-self:flex-end;
  }

  .jenis-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .jenis-icon-fallback{
    display:none;
    width:100%;
    height:100%;
    color:#101114;
  }

  .loc-dropdown{
    position:relative;
    margin-bottom:30px;
  }

  .loc-trigger{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1.5px solid #16181c;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
    font-family:'Poppins',sans-serif;
  }

  .loc-icon{
    width:20px;
    height:20px;
    color:#7fa89a;
    flex:0 0 auto;
  }

  .loc-text{
    flex:1;
    text-align:left;
    font-size:13.5px;
    color:#9a9a9c;
  }

  .loc-text.filled{
    color:#101114;
    font-weight:600;
  }

  .loc-chevron{
    width:16px;
    height:16px;
    color:#5a5a5c;
    flex:0 0 auto;
    transition:transform .15s ease;
  }

  .loc-dropdown.open .loc-chevron{
    transform:rotate(180deg);
  }

  .loc-menu{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    max-height:220px;
    overflow-y:auto;
    background:#fff;
    border:1.5px solid #16181c;
    border-radius:8px;
    box-shadow:0 10px 24px rgba(0,0,0,.14);
    padding:6px;
    margin:0;
    list-style:none;
    z-index:20;
  }

  .loc-dropdown.open .loc-menu{
    display:block;
  }

  .loc-menu li{
    padding:9px 12px;
    font-size:13.5px;
    font-weight:500;
    border-radius:5px;
    cursor:pointer;
  }

  .loc-menu li:hover{
    background:#eef0fb;
  }

  .action-row{
    display:flex;
    gap:16px;
  }

  .btn-action{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:42px;
    border-radius:20px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }

  .btn-action svg{
    width:15px;
    height:15px;
  }

  .btn-batal{
    background:#f7a8a4;
    border:1.5px solid #d94a40;
    color:#8a1e16;
  }

  .btn-simpan{
    background:#fff;
    border:2.5px solid #2b2fa0;
    color:#2b2fa0;
  }
  @media (max-width:900px){
    .brand-title{font-size:30px;}
    .brand-sub{font-size:11px;}
    .stats-cols{max-width:none;}
  }
</style>
</head>
<body>

<div class="dash" id="dash">

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="navToggle" aria-label="Tampilkan / sembunyikan navbar">
        <svg class="icon-profile" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
        <svg class="icon-hamburger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
    <div class="topbar-right">
      <div class="brand-block">
        <div class="brand-title">PARK-iR</div>
        <div class="brand-sub">SISTEM PARKIR BERBASIS DIGITAL</div>
      </div>
      <div class="topbar-logo">
        <img src="LOGO PARK-iR.png" alt="Logo PARK-iR"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback">
          <span class="P">P</span>
          <span class="tag">PARK-IR</span>
        </div>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav class="nav-list">
        <form action="dashboard.html">
      <button class="nav-btn">DASHBOARD</button>
        </form>
        <form action="kndkluar.html">
      <button class="nav-btn">KEND KELUAR</button>
        </form>
        <form action="riwayat.html">
      <button class="nav-btn">RIWAYAT</button>
        </form>
    </nav>
    <button class="nav-btn logout-btn">LOGOUT</button>
  </aside>

  <main class="content">
    <h1 class="page-title">KENDARAAN MASUK</h1>

    <div class="masuk-grid">
      <section class="panel panel-left">
        <div class="panel-head">
          <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="12" height="17" rx="1.5"></rect>
            <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"></path>
            <line x1="9" y1="10" x2="15" y2="10"></line>
            <line x1="9" y1="13.5" x2="15" y2="13.5"></line>
            <line x1="9" y1="17" x2="12.5" y2="17"></line>
          </svg>
          <span class="panel-head-text">INPUT KENDARAAN MASUK</span>
        </div>
        <p class="panel-desc">Silakan isi kendaraan yang akan masuk</p>

        <label class="field-label">Nomor Plat Kendaraan</label>
        <div class="plate-row">
          <div class="plate-icon-box" id="plateIconBox">
            <img src="icon-plat.jpg" alt="Foto Plat Nomor" id="plateIconImg"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="plate-icon-fallback">ABC-123</div>
          </div>
          <div class="plate-text">
            <input type="text" id="plateAwal" class="plate-input plate-input-w" placeholder="B" maxlength="2">
            <input type="text" id="plateAngka" class="plate-input plate-input-n" placeholder="1234" maxlength="4">
            <input type="text" id="plateAkhir" class="plate-input plate-input-w" placeholder="KSS" maxlength="3">
          </div>
        </div>

        <label class="field-label">Jenis Kendaraan</label>
        <div class="jenis-row">
          <button type="button" class="jenis-card" data-jenis="mobil" id="jenisMobil">
            <span class="jenis-tag jenis-tag-mobil">Mobil</span>
            <span class="jenis-icon">
              <img src="icon-mobil.jpg" alt="Ikon Mobil"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
              <svg class="jenis-icon-fallback" viewBox="0 0 24 24" fill="currentColor"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h1a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1z"></path></svg>
            </span>
          </button>

          <button type="button" class="jenis-card" data-jenis="motor" id="jenisMotor">
            <span class="jenis-tag jenis-tag-motor">Motor</span>
            <span class="jenis-icon">

              <img src="icon-motor.jpg" alt="Ikon Motor"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
              <svg class="jenis-icon-fallback" viewBox="0 0 24 24" fill="currentColor"><path d="M5 17a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm14 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM7 15l2-5h3l3 4h3M9 10l2-3h3"></path></svg>
            </span>
          </button>
        </div>
      </section>

      <section class="panel panel-right">
        <label class="field-label">Lokasi Parkir</label>

        <div class="loc-dropdown" id="locDropdown">
          <button type="button" class="loc-trigger" id="locTrigger">
            <svg class="loc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"></circle><path d="M10 7.5h2.6a2 2 0 0 1 0 4H10V16"></path></svg>
            <span class="loc-text" id="locText">Pilih Lokasi Parkir</span>
            <svg class="loc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <ul class="loc-menu" id="locMenu"></ul>
        </div>

        <div class="action-row">
          <button type="button" class="btn-action btn-batal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
            Batal
          </button>
          <button type="button" class="btn-action btn-simpan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Simpan &amp; Cetak
          </button>
        </div>
      </section>

    </div>
  </main>

</div>

<script>
  const zones = ['A', 'B', 'C', 'D'];
  const locDropdown = document.getElementById('locDropdown');
  const locTrigger  = document.getElementById('locTrigger');
  const locMenu     = document.getElementById('locMenu');
  const locText     = document.getElementById('locText');

  let level = 'zone';    
  let activeZone = null;

  function renderLocMenu(){
    locMenu.innerHTML = '';
    const items = level === 'zone'
      ? zones
      : Array.from({length:10}, (_, i) => activeZone + (i + 1));

    items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      li.addEventListener('click', (e) => {
        e.stopPropagation();
        if (level === 'zone') {
          activeZone = item;
          level = 'slot';
          renderLocMenu();
        } else {
          locText.textContent = item;
          locText.classList.add('filled');
          closeLocMenu();
          level = 'zone';
          activeZone = null;
        }
      });
      locMenu.appendChild(li);
    });
  }

  function openLocMenu(){
    level = 'zone';
    activeZone = null;
    renderLocMenu();
    locDropdown.classList.add('open');
  }

  function closeLocMenu(){
    locDropdown.classList.remove('open');
  }

  locTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    locDropdown.classList.contains('open') ? closeLocMenu() : openLocMenu();
  });

  document.addEventListener('click', closeLocMenu);

  const jenisCards = document.querySelectorAll('.jenis-card');
  jenisCards.forEach(card => {
    card.addEventListener('click', () => {
      jenisCards.forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    });
  });

  document.querySelectorAll('.plate-input').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase();
    });
  });
</script>

<script>
  const dash = document.getElementById('dash');
  const navToggle = document.getElementById('navToggle');

  navToggle.addEventListener('click', () => {
    dash.classList.toggle('collapsed');
    dash.style.setProperty('--side-w', dash.classList.contains('collapsed') ? '70px' : '186px');
  });
</script>

</body>
</html>
